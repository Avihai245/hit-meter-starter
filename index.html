<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Hit Meter Pro</title>
    <meta name="description" content="Hit Meter Pro - High-precision event tracking" />
    <meta name="author" content="Hit Meter Pro" />

    <meta property="og:title" content="Hit Meter Pro" />
    <meta property="og:description" content="High-precision event tracking" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Disable right-click context menu
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
      // Disable common DevTools shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.key === 'F12') { e.preventDefault(); }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) { e.preventDefault(); }
        if (e.ctrlKey && e.key === 'u') { e.preventDefault(); }
      });
    </script>
  </body>
</html>
